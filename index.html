<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paywall Gallery 监控面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.4"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6b7280;
    --subtle: #f7f8fa;
    --line: rgba(0, 0, 0, 0.08);
    --primary: #378ADD;
    --primary-soft: rgba(55, 138, 221, 0.10);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* Header */
  .header { margin-bottom: 28px; }
  .header h1 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    color: var(--muted); font-size: 13px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary-soft);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
  }

  /* Weekly changes */
  .weekly-changes {
    margin: 24px 0;
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .weekly-head {
    display: flex; flex-direction: column; gap: 4px;
    margin-bottom: 14px;
  }
  .weekly-head h2 {
    margin: 0; font-size: 16px; font-weight: 600;
  }
  .weekly-dates { color: var(--muted); font-size: 12px; }
  .weekly-empty { color: var(--muted); font-size: 13px; }
  .change-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .change-card {
    text-align: left;
    background: var(--bg);
    border: 0.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    font: inherit; color: inherit;
    transition: border-color 120ms, background 120ms;
  }
  .change-card:hover { border-color: var(--primary); background: var(--primary-soft); }
  .change-card.active { border-color: var(--primary); background: var(--primary-soft); }
  .change-card .ck-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .change-card .ck-value { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .change-card .ck-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .change-detail {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 0.5px solid var(--line);
    max-height: 480px;
    overflow: auto;
  }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .detail-table th, .detail-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 0.5px solid var(--line);
    vertical-align: top;
  }
  .detail-table th {
    font-weight: 500; color: var(--muted); font-size: 12px;
    background: var(--bg);
    position: sticky; top: 0;
  }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table td.num { font-variant-numeric: tabular-nums; }

  .price-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .price-badge.up   { background: rgba(231, 76, 60, 0.10);  color: #b03a2e; }
  .price-badge.down { background: rgba(46, 204, 113, 0.12); color: #1e8449; }

  .type-arrow { color: var(--muted); margin: 0 4px; }
  .detail-empty {
    padding: 20px; color: var(--muted); text-align: center; font-size: 13px;
  }

  /* Metric cards */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .metric {
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    background: var(--bg);
  }
  .metric .label {
    color: var(--muted); font-size: 12px; margin-bottom: 6px;
  }
  .metric .value {
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  }
  .metric .sub {
    color: var(--muted); font-size: 12px; margin-top: 4px;
  }

  /* Charts */
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 24px 0;
  }
  @media (max-width: 800px) {
    .charts { grid-template-columns: 1fr; }
  }
  .chart-card {
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .chart-card h3 {
    margin: 0 0 12px;
    font-size: 14px; font-weight: 600;
  }
  .chart-card-full { margin: 24px 0; }
  .chart-sub {
    color: var(--muted); font-size: 12px;
    margin: -6px 0 14px;
  }
  .chart-wrap { position: relative; height: 280px; }
  .chart-wrap-tall { height: 360px; }

  /* Filters */
  .filters {
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 24px 0 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field select, .field input {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    appearance: none;
    -webkit-appearance: none;
  }
  .field select:focus, .field input:focus {
    outline: none; border-color: var(--primary);
  }

  .result-bar {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 12px;
    margin: 16px 4px 12px;
  }

  /* App grid */
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .app-card {
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .app-card:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .app-card .title {
    font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
  }
  .app-card .dev { color: var(--muted); font-size: 12px; }
  .tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--subtle);
    color: var(--fg);
    border: 0.5px solid var(--line);
  }
  .tag.primary {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: transparent;
  }
  .kv {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;
    margin-top: 6px; font-size: 12px;
  }
  .kv .k { color: var(--muted); }
  .kv .v { text-align: right; font-variant-numeric: tabular-nums; }

  .empty, .loading {
    border: 0.5px dashed var(--line);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  .load-more {
    margin: 20px auto 0;
    display: block;
    padding: 10px 18px;
    background: var(--bg);
    color: var(--primary);
    border: 0.5px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
  }
  .load-more:hover { background: var(--primary-soft); }
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <h1>Paywall Gallery</h1>
    <div class="meta">
      <span id="meta-updated">加载中…</span>
    </div>
  </header>

  <section class="weekly-changes" id="weekly-changes" hidden aria-label="本周变化">
    <div class="weekly-head">
      <h2>本周变化</h2>
      <div class="weekly-dates" id="weekly-dates"></div>
    </div>
    <div class="weekly-empty" id="weekly-empty" hidden></div>
    <div class="change-cards" id="change-cards"></div>
    <div class="change-detail" id="change-detail" hidden></div>
  </section>

  <section class="metrics" id="metrics" aria-label="关键指标">
    <div class="metric"><div class="label">总 App 数</div><div class="value" id="m-total">—</div></div>
    <div class="metric"><div class="label">含免费试用占比</div><div class="value" id="m-trial">—</div><div class="sub" id="m-trial-sub"></div></div>
    <div class="metric"><div class="label">平均月价</div><div class="value" id="m-monthly">—</div><div class="sub" id="m-monthly-sub"></div></div>
  </section>

  <section class="charts">
    <div class="chart-card">
      <h3>付费墙类型分布</h3>
      <div class="chart-wrap"><canvas id="chart-type"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>类别 MRR Top 10</h3>
      <div class="chart-wrap"><canvas id="chart-cat"></canvas></div>
    </div>
  </section>

  <section class="chart-card chart-card-full">
    <h3>类别定价分布（月价）</h3>
    <div class="chart-sub" id="pricing-sub">箱体 = Q1 到 Q3，中间粗线 = 中位数，须线 = 最低/最高。点击类别可筛选下方 App 列表。</div>
    <div class="chart-wrap chart-wrap-tall"><canvas id="chart-pricing"></canvas></div>
  </section>

  <section class="filters" aria-label="筛选与排序">
    <div class="field">
      <label for="f-category">类别</label>
      <select id="f-category"><option value="">全部</option></select>
    </div>
    <div class="field">
      <label for="f-type">付费墙类型</label>
      <select id="f-type"><option value="">全部</option></select>
    </div>
    <div class="field">
      <label for="f-trial">免费试用</label>
      <select id="f-trial">
        <option value="">全部</option>
        <option value="yes">含免费试用</option>
        <option value="no">不含免费试用</option>
      </select>
    </div>
    <div class="field">
      <label for="f-sort">排序</label>
      <select id="f-sort">
        <option value="mrr">MRR 降序</option>
        <option value="rating">评分降序</option>
        <option value="name">名称升序</option>
      </select>
    </div>
    <div class="field">
      <label for="f-search">搜索</label>
      <input id="f-search" type="search" placeholder="按 App 名称…" autocomplete="off" />
    </div>
  </section>

  <div class="result-bar">
    <span id="result-count">—</span>
    <span id="result-hint"></span>
  </div>

  <section class="apps" id="apps-grid"><div class="loading">加载中…</div></section>
  <button class="load-more" id="load-more" hidden>显示更多</button>
</main>

<script>
const PAGE_SIZE = 60;
const state = {
  apps: [],
  filtered: [],
  page: 1,
  filters: { category: "", type: "", trial: "", sort: "mrr", search: "" },
  charts: { type: null, cat: null, pricing: null },
  changes: null,
  activeChangeKind: null,
};

function fmtMRR(numMillions) {
  if (!numMillions) return "$0";
  if (numMillions >= 1) return `$${numMillions.toFixed(2)}M`;
  return `$${(numMillions * 1000).toFixed(1)}K`;
}

function fmtPercent(n) { return `${(n * 100).toFixed(1)}%`; }
function fmtPrice(n) { return n ? `$${n.toFixed(2)}` : "—"; }

function renderMeta(payload) {
  const updated = new Date(payload.updated_at);
  const dateStr = updated.toLocaleString("zh-CN", { hour12: false });
  document.getElementById("meta-updated").textContent = `更新于 ${dateStr}`;
}

async function initChanges() {
  try {
    const res = await fetch("./changes.json", { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    state.changes = data;
    renderWeeklyChanges(data);
  } catch (_) {
    // file missing or invalid — leave section hidden
  }
}

function renderWeeklyChanges(data) {
  const section = document.getElementById("weekly-changes");
  section.hidden = false;
  document.getElementById("weekly-dates").textContent =
    `对比日期 ${data.previous_date} → ${data.current_date}`;

  const s = data.summary;
  const total = s.added + s.removed + s.pricing_changed + s.paywall_type_changed;
  const emptyEl = document.getElementById("weekly-empty");
  const cardsEl = document.getElementById("change-cards");

  if (total === 0) {
    emptyEl.hidden = false;
    emptyEl.textContent = `本周无变化（对比 ${data.previous_date} → ${data.current_date}）`;
    cardsEl.hidden = true;
    return;
  }
  emptyEl.hidden = true;
  cardsEl.hidden = false;

  const upCount = data.pricing_changes.filter(c => c.direction === "up").length;
  const downCount = data.pricing_changes.filter(c => c.direction === "down").length;
  const pricingSub = (upCount || downCount)
    ? `上涨 ${upCount} 个 / 下调 ${downCount} 个`
    : "";

  const cards = [
    { kind: "added",   label: "新增 App",         value: s.added,                sub: "" },
    { kind: "pricing", label: "价格调整",         value: s.pricing_changed,      sub: pricingSub },
    { kind: "paywall", label: "付费墙策略变更",   value: s.paywall_type_changed, sub: "" },
  ];

  cardsEl.innerHTML = cards.map(c => `
    <button class="change-card" data-kind="${c.kind}" type="button">
      <div class="ck-label">${escapeHTML(c.label)}</div>
      <div class="ck-value">${c.value}</div>
      ${c.sub ? `<div class="ck-sub">${escapeHTML(c.sub)}</div>` : ""}
    </button>
  `).join("");

  cardsEl.querySelectorAll(".change-card").forEach(btn => {
    btn.addEventListener("click", () => toggleChangeDetail(btn.dataset.kind));
  });
}

function toggleChangeDetail(kind) {
  const detail = document.getElementById("change-detail");
  const cards = document.querySelectorAll(".change-card");
  const closing = state.activeChangeKind === kind;
  cards.forEach(c => c.classList.toggle("active", !closing && c.dataset.kind === kind));

  if (closing) {
    detail.hidden = true;
    detail.innerHTML = "";
    state.activeChangeKind = null;
    return;
  }
  detail.innerHTML = renderChangeDetail(kind);
  detail.hidden = false;
  state.activeChangeKind = kind;
}

function renderChangeDetail(kind) {
  const d = state.changes;
  if (!d) return "";
  if (kind === "added")   return renderAddedTable(d.added_apps);
  if (kind === "pricing") return renderPricingTable(d.pricing_changes);
  if (kind === "paywall") return renderPaywallTable(d.paywall_type_changes);
  return "";
}

function renderAddedTable(apps) {
  if (!apps.length) return `<div class="detail-empty">本周无新增 App</div>`;
  const rows = apps.map(a => `
    <tr>
      <td>${escapeHTML(a.app_name)}</td>
      <td>${escapeHTML(a.category)}</td>
      <td class="num">${a.monthly_price_num ? `$${a.monthly_price_num.toFixed(2)}` : "—"}</td>
      <td class="num">${fmtMRR(a.mrr_num)}</td>
      <td>${escapeHTML(a.paywall_type)}</td>
    </tr>
  `).join("");
  return `
    <table class="detail-table">
      <thead><tr><th>App</th><th>类别</th><th>月价</th><th>估算 MRR</th><th>付费墙类型</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderPricingTable(changes) {
  if (!changes.length) return `<div class="detail-empty">本周无价格调整</div>`;
  const rows = changes.map(c => {
    const pctAbs = Math.abs(c.change_pct).toFixed(1);
    const text = c.direction === "up" ? `上涨 ${pctAbs}%` : `下调 ${pctAbs}%`;
    return `
      <tr>
        <td>${escapeHTML(c.app_name)}</td>
        <td>${escapeHTML(c.category)}</td>
        <td class="num">$${c.old_price.toFixed(2)}</td>
        <td class="num">$${c.new_price.toFixed(2)}</td>
        <td><span class="price-badge ${c.direction}">${text}</span></td>
      </tr>
    `;
  }).join("");
  return `
    <table class="detail-table">
      <thead><tr><th>App</th><th>类别</th><th>原价</th><th>新价</th><th>变化</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderPaywallTable(changes) {
  if (!changes.length) return `<div class="detail-empty">本周无付费墙策略变更</div>`;
  const rows = changes.map(c => `
    <tr>
      <td>${escapeHTML(c.app_name)}</td>
      <td>${escapeHTML(c.category)}</td>
      <td>${escapeHTML(c.old_type)}<span class="type-arrow">→</span></td>
      <td>${escapeHTML(c.new_type)}</td>
    </tr>
  `).join("");
  return `
    <table class="detail-table">
      <thead><tr><th>App</th><th>类别</th><th>原类型</th><th>新类型</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderMetrics(apps) {
  const total = apps.length;
  const trialCount = apps.filter(a => a.has_free_trial).length;
  const monthlies = apps.map(a => a.monthly_price_num).filter(n => n > 0);
  const avgMonthly = monthlies.length ? monthlies.reduce((s, n) => s + n, 0) / monthlies.length : 0;

  document.getElementById("m-total").textContent = total.toLocaleString();
  document.getElementById("m-trial").textContent = total ? fmtPercent(trialCount / total) : "—";
  document.getElementById("m-trial-sub").textContent = `${trialCount} / ${total}`;
  document.getElementById("m-monthly").textContent = fmtPrice(avgMonthly);
  document.getElementById("m-monthly-sub").textContent = `基于 ${monthlies.length} 个有月价的 App`;
}

function groupBy(arr, keyFn) {
  const map = new Map();
  for (const item of arr) {
    const k = keyFn(item) || "Unknown";
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(item);
  }
  return map;
}

function renderCharts(apps) {
  const PRIMARY = "#378ADD";
  const PALETTE = [
    "#378ADD", "#7F77DD", "#5BA8E8", "#9B8FE3", "#4FC0C7",
    "#F4A261", "#E76F51", "#8DAA53", "#C9A86A", "#A0AEC0",
  ];

  // Type doughnut
  const byType = groupBy(apps, a => a.paywall_type);
  const typeLabels = [...byType.keys()].sort((a, b) => byType.get(b).length - byType.get(a).length);
  const typeData = typeLabels.map(k => byType.get(k).length);
  const typeColors = typeLabels.map((_, i) => PALETTE[i % PALETTE.length]);

  if (state.charts.type) state.charts.type.destroy();
  state.charts.type = new Chart(document.getElementById("chart-type"), {
    type: "doughnut",
    data: { labels: typeLabels, datasets: [{ data: typeData, backgroundColor: typeColors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { boxWidth: 10, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const total = typeData.reduce((s, n) => s + n, 0);
              const pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : "0";
              return `${ctx.label}: ${ctx.parsed} (${pct}%)`;
            },
          },
        },
      },
      cutout: "60%",
    },
  });

  // Category MRR Top 10
  const byCat = groupBy(apps, a => a.category);
  const catSums = [...byCat.entries()].map(([k, list]) => ({
    cat: k, mrr: list.reduce((s, a) => s + (a.mrr_num || 0), 0),
  })).sort((a, b) => b.mrr - a.mrr).slice(0, 10);

  if (state.charts.cat) state.charts.cat.destroy();
  state.charts.cat = new Chart(document.getElementById("chart-cat"), {
    type: "bar",
    data: {
      labels: catSums.map(x => x.cat),
      datasets: [{ data: catSums.map(x => x.mrr), backgroundColor: PRIMARY, borderRadius: 4 }],
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => ` ${fmtMRR(ctx.parsed.x)}` } },
      },
      scales: {
        x: { ticks: { callback: (v) => fmtMRR(v), font: { size: 10 } }, grid: { color: "rgba(0,0,0,0.04)" } },
        y: { ticks: { font: { size: 11 } }, grid: { display: false } },
      },
    },
  });
}

function quantile(sortedAsc, p) {
  const n = sortedAsc.length;
  if (n === 0) return 0;
  if (n === 1) return sortedAsc[0];
  const pos = p * (n - 1);
  const lower = Math.floor(pos);
  const upper = Math.ceil(pos);
  if (lower === upper) return sortedAsc[lower];
  return sortedAsc[lower] + (pos - lower) * (sortedAsc[upper] - sortedAsc[lower]);
}

function calculateCategoryPricing(apps) {
  const groups = new Map();
  for (const a of apps) {
    if (!(a.monthly_price_num > 0)) continue;
    const cat = a.category || "Uncategorized";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(a.monthly_price_num);
  }
  const stats = [];
  for (const [cat, values] of groups) {
    if (values.length < 5) continue;
    const sorted = [...values].sort((a, b) => a - b);
    stats.push({
      category: cat,
      count: sorted.length,
      min: sorted[0],
      q1: quantile(sorted, 0.25),
      median: quantile(sorted, 0.5),
      q3: quantile(sorted, 0.75),
      max: sorted[sorted.length - 1],
    });
  }
  stats.sort((a, b) => b.count - a.count);
  return stats.slice(0, 12);
}

function renderPricingChart(apps) {
  const stats = calculateCategoryPricing(apps);
  const labels = stats.map(s => s.category);
  const data = stats.map(s => ({
    min: s.min, q1: s.q1, median: s.median, q3: s.q3, max: s.max,
  }));

  // Y 轴上限：极端高价（如 $349）会把箱子全挤到底部。
  // 按所有类别 max 的 80% 分位 * 1.15 padding 设上限，
  // 同时保证 ≥ 最大 Q3 * 1.5，避免任何箱体本身被截。
  const maxesAsc = stats.map(s => s.max).sort((a, b) => a - b);
  const q3MaxAll = stats.length ? Math.max(...stats.map(s => s.q3)) : 0;
  const robustMax = maxesAsc.length ? quantile(maxesAsc, 0.80) : 0;
  const yMax = Math.max(50, Math.ceil(Math.max(q3MaxAll * 1.5, robustMax * 1.15) / 10) * 10);
  const clippedCats = stats.filter(s => s.max > yMax).map(s => s.category);

  const subEl = document.getElementById("pricing-sub");
  if (subEl) {
    const base = "箱体 = Q1 到 Q3，中间粗线 = 中位数，须线 = 最低/最高。点击类别可筛选下方 App 列表。";
    subEl.textContent = clippedCats.length
      ? `${base} ${clippedCats.join("、")} 含极端高价，最高值已超出显示范围，悬停查看真实数值。`
      : base;
  }

  if (state.charts.pricing) state.charts.pricing.destroy();
  state.charts.pricing = new Chart(document.getElementById("chart-pricing"), {
    type: "boxplot",
    data: {
      labels,
      datasets: [{
        label: "月价",
        data,
        backgroundColor: "rgba(55, 138, 221, 0.25)",
        borderColor: "#378ADD",
        borderWidth: 1.5,
        medianColor: "#0C447C",
        itemRadius: 0,
        outlierRadius: 0,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => items[0].label,
            label: (ctx) => {
              const s = stats[ctx.dataIndex];
              const maxLine = s.max > yMax
                ? `最高 $${s.max.toFixed(2)}（超出显示范围）`
                : `最高 $${s.max.toFixed(2)}`;
              return [
                `样本数：${s.count} 个 App`,
                `最低 $${s.min.toFixed(2)}`,
                `Q1 $${s.q1.toFixed(2)}`,
                `中位 $${s.median.toFixed(2)}`,
                `Q3 $${s.q3.toFixed(2)}`,
                maxLine,
              ];
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { maxRotation: 45, minRotation: 45, font: { size: 11 }, autoSkip: false },
          grid: { display: false },
        },
        y: {
          beginAtZero: true,
          max: yMax,
          ticks: { callback: (v) => `$${v}`, font: { size: 11 } },
          grid: { color: "rgba(0,0,0,0.04)" },
          title: { display: true, text: "月价（USD）", font: { size: 11 }, color: "#6b7280" },
        },
      },
      onClick: (_e, elements) => {
        if (!elements.length) return;
        const cat = labels[elements[0].index];
        const sel = document.getElementById("f-category");
        sel.value = cat;
        state.filters.category = cat;
        applyFilters();
        document.getElementById("apps-grid").scrollIntoView({ behavior: "smooth", block: "start" });
      },
    },
  });
}

function populateFilters(apps) {
  const cats = [...new Set(apps.map(a => a.category))].sort();
  const types = [...new Set(apps.map(a => a.paywall_type))].sort();
  const catSel = document.getElementById("f-category");
  const typeSel = document.getElementById("f-type");
  for (const c of cats) catSel.insertAdjacentHTML("beforeend", `<option value="${escapeAttr(c)}">${escapeHTML(c)}</option>`);
  for (const t of types) typeSel.insertAdjacentHTML("beforeend", `<option value="${escapeAttr(t)}">${escapeHTML(t)}</option>`);
}

function applyFilters() {
  const { category, type, trial, sort, search } = state.filters;
  const q = search.trim().toLowerCase();

  let out = state.apps.filter(a => {
    if (category && a.category !== category) return false;
    if (type && a.paywall_type !== type) return false;
    if (trial === "yes" && !a.has_free_trial) return false;
    if (trial === "no" && a.has_free_trial) return false;
    if (q && !a.app_name.toLowerCase().includes(q)) return false;
    return true;
  });

  out.sort((a, b) => {
    if (sort === "rating") return (b.rating || 0) - (a.rating || 0);
    if (sort === "name") return a.app_name.localeCompare(b.app_name);
    return (b.mrr_num || 0) - (a.mrr_num || 0);
  });

  state.filtered = out;
  state.page = 1;
  renderApps();
}

function renderApps() {
  const grid = document.getElementById("apps-grid");
  const list = state.filtered;
  document.getElementById("result-count").textContent = `共 ${list.length} 个 App`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty">没有匹配的 App</div>`;
    document.getElementById("load-more").hidden = true;
    return;
  }

  const limit = state.page * PAGE_SIZE;
  const slice = list.slice(0, limit);
  grid.innerHTML = slice.map(cardHTML).join("");
  document.getElementById("load-more").hidden = limit >= list.length;
  document.getElementById("result-hint").textContent = `显示 ${slice.length} / ${list.length}`;
}

function cardHTML(a) {
  const href = a.github_url || a.app_detail_url;
  const monthly = a.monthly_price_num ? fmtPrice(a.monthly_price_num) : "—";
  const rating = a.rating ? a.rating.toFixed(2) : "—";
  const mrrDisplay = a.mrr || fmtMRR(a.mrr_num);
  return `
    <a class="app-card" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">
      <div class="title">${escapeHTML(a.app_name)}</div>
      <div class="dev">${escapeHTML(a.developer || "—")}</div>
      <div class="tags">
        <span class="tag primary">${escapeHTML(a.category)}</span>
        <span class="tag">${escapeHTML(a.paywall_type)}</span>
        ${a.has_free_trial ? '<span class="tag">免费试用</span>' : ""}
      </div>
      <div class="kv">
        <span class="k">MRR</span><span class="v">${escapeHTML(mrrDisplay)}</span>
        <span class="k">月价</span><span class="v">${monthly}</span>
        <span class="k">评分</span><span class="v">${rating}</span>
        <span class="k">定价模型</span><span class="v" title="${escapeAttr(a.pricing_model)}">${escapeHTML(truncate(a.pricing_model, 22))}</span>
      </div>
    </a>
  `;
}

function truncate(s, n) {
  if (!s) return "—";
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}
function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHTML(s); }

function wireEvents() {
  const f = state.filters;
  document.getElementById("f-category").addEventListener("change", e => { f.category = e.target.value; applyFilters(); });
  document.getElementById("f-type").addEventListener("change", e => { f.type = e.target.value; applyFilters(); });
  document.getElementById("f-trial").addEventListener("change", e => { f.trial = e.target.value; applyFilters(); });
  document.getElementById("f-sort").addEventListener("change", e => { f.sort = e.target.value; applyFilters(); });
  document.getElementById("f-search").addEventListener("input", e => { f.search = e.target.value; applyFilters(); });
  document.getElementById("load-more").addEventListener("click", () => { state.page += 1; renderApps(); });
}

async function init() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    state.apps = payload.apps || [];
    renderMeta(payload);
    renderMetrics(state.apps);
    renderCharts(state.apps);
    renderPricingChart(state.apps);
    populateFilters(state.apps);
    wireEvents();
    applyFilters();
    initChanges();
  } catch (e) {
    document.getElementById("apps-grid").innerHTML =
      `<div class="empty">加载 data.json 失败：${escapeHTML(e.message)}</div>`;
    document.getElementById("meta-updated").textContent = "数据加载失败";
  }
}

init();
</script>
</body>
