name: Update data.json

on:
  schedule:
    # 每周一 UTC 08:00 触发
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run parser
        run: python scripts/parse.py

      - name: Commit outputs if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history/
          # changes.json may have been deleted by parse.py on first run
          if [ -f changes.json ]; then
            git add changes.json
          else
            git add -u changes.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly data update ($(date -u +%Y-%m-%d))"
          git push
